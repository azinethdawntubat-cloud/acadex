<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>Offline – Acadex</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f3f4f6; color: #263238; text-align: center; padding: 24px;
        }
        .box { max-width: 380px; }
        img { width: 84px; height: 84px; border-radius: 20px; }
        h1 { font-size: 22px; margin: 18px 0 8px; }
        p { color: #667085; line-height: 1.5; margin: 0 0 22px; }
        button {
            background: #1d4f91; color: #fff; border: 0; border-radius: 8px;
            padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #14181f; color: #e6e9ee; }
            p { color: #9aa4b2; }
            button { background: #4d84e2; }
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/icons/icon-192.png" alt="Acadex">
        <h1>You're offline</h1>
        <p>Acadex needs an internet connection to load your records. Check your connection and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
